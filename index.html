<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHRONO-RUN - Minimalist Dark Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #202124;
            font-family: 'Courier New', Courier, monospace;
            color: #535353;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 1.5s ease;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Top Minimalist Score HUD */
        #hud {
            position: absolute;
            top: 24px;
            right: 30px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #757575;
            pointer-events: none;
            z-index: 10;
        }
        #hud span {
            color: #acacac;
        }
        /* Top Controls: Sound & Skin Picker */
        #top-controls {
            position: absolute;
            top: 20px;
            left: 24px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .btn-ctrl {
            background: rgba(32, 33, 36, 0.85);
            border: 1px solid #3c4043;
            color: #9aa0a6;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-ctrl:hover {
            border-color: #8ab4f8;
            color: #e8eaed;
        }
        /* Desktop Instructions */
        #instructions {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 1px;
            color: #5f6368;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        /* Mobile Touch Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            display: none;
            justify-content: space-between;
            pointer-events: none;
            z-index: 15;
        }
        .touch-btn {
            pointer-events: auto;
            width: 76px;
            height: 76px;
            background: rgba(45, 46, 49, 0.75);
            border: 2px solid #5f6368;
            border-radius: 50%;
            color: #e8eaed;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.1s;
        }
        .touch-btn:active {
            transform: scale(0.92);
            background: rgba(138, 180, 248, 0.3);
            border-color: #8ab4f8;
        }
        /* Gamepad Indicator Badge */
        #gamepad-badge {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(32, 33, 36, 0.85);
            border: 1px solid #3c4043;
            color: #8ab4f8;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            display: none;
            z-index: 10;
        }
        /* Game Over Overlay */
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 20;
        }
        #game-over h2 {
            font-size: 22px;
            letter-spacing: 4px;
            color: #e8eaed;
            margin-bottom: 8px;
        }
        #game-over p {
            font-size: 13px;
            color: #9aa0a6;
            letter-spacing: 1px;
        }
        #restart-prompt {
            font-size: 12px;
            color: #8ab4f8;
            margin-top: 14px;
        }
        /* Show Touch Buttons on Touch Devices */
        @media (pointer: coarse) or (max-width: 800px) {
            #mobile-controls {
                display: flex;
            }
            #instructions {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="top-controls">
            <button id="audio-toggle" class="btn-ctrl">SOUND: ON</button>
            <button id="skin-toggle" class="btn-ctrl">SKIN: CLASSIC</button>
        </div>

        <div id="gamepad-badge">🎮 GAMEPAD CONNECTED</div>

        <div id="hud">
            HI <span id="hi-val">00000</span> &nbsp; <span id="score-val">00000</span>
        </div>

        <div id="instructions">
            [SPACE/↑/A-BTN] JUMP (TAP IN AIR FOR DOUBLE-JUMP) • [↓/B-BTN] DUCK / FAST DROP
        </div>

        <!-- Mobile Touch Action Buttons -->
        <div id="mobile-controls">
            <div id="btn-duck" class="touch-btn">▼</div>
            <div id="btn-jump" class="touch-btn">▲</div>
        </div>

        <div id="game-over">
            <h2>G A M E &nbsp; O V E R</h2>
            <p id="score-summary"></p>
            <div id="restart-prompt">TAP OR PRESS JUMP TO RESTART</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. Audio Synthesizer
        let audioEnabled = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioEnabled || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(380, now);
                    osc.frequency.exponentialRampToValueAtTime(650, now + 0.05);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'double_jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(550, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now); osc.stop(now + 0.06);
                } else if (type === 'gem') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(783.99, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'milestone') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.setValueAtTime(1000, now + 0.06);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                }
            } catch(e) {}
        }

        const audioToggle = document.getElementById('audio-toggle');
        audioToggle.addEventListener('click', () => {
            initAudio();
            audioEnabled = !audioEnabled;
            audioToggle.innerText = audioEnabled ? "SOUND: ON" : "SOUND: OFF";
            audioToggle.style.color = audioEnabled ? "#9aa0a6" : "#5f6368";
        });

        // 2. Custom Skins System
        const SKINS = [
            { name: "CLASSIC", shape: "square", color: "#e8eaed", eye: "#202124" },
            { name: "CYBER NEON", shape: "neon_triangle", color: "#00f0ff", eye: "#ff007a" },
            { name: "GOLD PHANTOM", shape: "diamond", color: "#f59e0b", eye: "#ffffff" },
            { name: "EMERALD BOT", shape: "bot", color: "#10b981", eye: "#042f2e" }
        ];
        let currentSkinIndex = 0;

        const skinToggle = document.getElementById('skin-toggle');
        skinToggle.addEventListener('click', () => {
            currentSkinIndex = (currentSkinIndex + 1) % SKINS.length;
            skinToggle.innerText = `SKIN: ${SKINS[currentSkinIndex].name}`;
            playSound('gem');
        });

        // 3. Game State
        let highScore = parseInt(localStorage.getItem('dino_hi_score') || '0');
        let currentScore = 0;
        let isGameOver = false;

        // Balanced Progressive Speed: starts smooth & gentle, scales gradually
        const BASE_SPEED = 4.8;
        let speed = BASE_SPEED;
        let screenShake = 0;

        const hiVal = document.getElementById('hi-val');
        const scoreVal = document.getElementById('score-val');
        const gameOverModal = document.getElementById('game-over');
        const scoreSummary = document.getElementById('score-summary');
        const gamepadBadge = document.getElementById('gamepad-badge');

        hiVal.innerText = highScore.toString().padStart(5, '0');

        // Player Entity
        const player = {
            x: 100,
            y: 0,
            baseWidth: 26,
            baseHeight: 34,
            width: 26,
            height: 34,
            vy: 0,
            onGround: false,
            canDoubleJump: true,
            isDucking: false
        };

        const GRAVITY = 0.65;
        const JUMP_FORCE = 12.0;

        // Entities
        const obstacles = [];
        const bonusBits = [];
        const particles = [];
        const runningDust = [];
        const clouds = [];
        const groundDots = [];

        // Background Init
        function initBackground() {
            clouds.length = 0;
            groundDots.length = 0;
            const floorY = canvas.height * 0.65;

            for(let i=0; i<6; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (floorY - 160) + 40,
                    w: Math.random() * 45 + 30,
                    h: 12
                });
            }

            for(let i=0; i<35; i++) {
                groundDots.push({
                    x: Math.random() * canvas.width,
                    y: floorY + Math.random() * 15 + 4,
                    w: Math.random() * 3 + 1
                });
            }
        }
        initBackground();

        function spawnObstacle() {
            const floorY = canvas.height * 0.65;
            // Birds only unlock after score > 200
            const isBird = currentScore > 200 && Math.random() < 0.35;

            if (isBird) {
                const birdHeight = Math.random() < 0.5 ? floorY - 30 : floorY - 58;
                obstacles.push({
                    x: canvas.width + 50,
                    y: birdHeight,
                    w: 30,
                    h: 16,
                    type: 'bird',
                    wing: 0
                });
            } else {
                const count = Math.random() < 0.3 ? 2 : 1;
                const h = Math.random() * 12 + 26; // Moderate friendly obstacle height
                obstacles.push({
                    x: canvas.width + 50,
                    y: floorY - h,
                    w: 15 * count,
                    h: h,
                    type: 'cactus'
                });
            }

            // Spawn Rare Floating Bonus Bit (✦)
            if (Math.random() < 0.25) {
                bonusBits.push({
                    x: canvas.width + 120,
                    y: floorY - Math.random() * 70 - 40,
                    size: 8,
                    collected: false
                });
            }
        }

        // 4. Input & Control Handlers (Keyboard, Mouse, Touch & Gamepad)
        function doJump() {
            initAudio();
            if (isGameOver) {
                resetGame();
                return;
            }

            if (player.onGround && !player.isDucking) {
                player.vy = -JUMP_FORCE;
                player.onGround = false;
                player.canDoubleJump = true;
                playSound('jump');

                for(let i=0; i<4; i++) {
                    runningDust.push({
                        x: player.x + Math.random() * player.width,
                        y: canvas.height * 0.65 - 2,
                        vx: -Math.random() * 2 - 1,
                        vy: -Math.random() * 1.5,
                        size: 3, alpha: 0.8
                    });
                }
            } else if (!player.onGround && player.canDoubleJump && !player.isDucking) {
                // Double Jump
                player.vy = -JUMP_FORCE * 0.85;
                player.canDoubleJump = false;
                playSound('double_jump');

                for(let i=0; i<5; i++) {
                    runningDust.push({
                        x: player.x + player.width/2 + (Math.random() - 0.5) * 16,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 3,
                        vy: Math.random() * 2,
                        size: 2.5, alpha: 0.8
                    });
                }
            }
        }

        function setDucking(isDucking) {
            player.isDucking = isDucking;
            if (isDucking && !player.onGround) {
                player.vy += 4.5; // Fast drop
            }
        }

        // Keyboard Listener
        window.addEventListener('keydown', e => {
            initAudio();
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.key.toLowerCase() === 'w') {
                e.preventDefault();
                doJump();
            }
            if (e.code === 'ArrowDown' || e.key.toLowerCase() === 's') {
                e.preventDefault();
                setDucking(true);
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowDown' || e.key.toLowerCase() === 's') {
                setDucking(false);
            }
        });

        // Mouse Click
        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'BUTTON' && !e.target.classList.contains('touch-btn')) {
                if (e.button === 0) doJump();
            }
        });

        // Mobile Touch Listeners
        const btnJump = document.getElementById('btn-jump');
        const btnDuck = document.getElementById('btn-duck');

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        btnDuck.addEventListener('touchstart', (e) => { e.preventDefault(); setDucking(true); });
        btnDuck.addEventListener('touchend', (e) => { e.preventDefault(); setDucking(false); });

        // Swipe Gestures for Mobile
        let touchStartY = 0;
        window.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', e => {
            let dy = e.touches[0].clientY - touchStartY;
            if (dy > 35) setDucking(true);
            else if (dy < -35) doJump();
        }, { passive: true });

        window.addEventListener('touchend', () => setDucking(false));

        // Gamepad Polling Loop
        let gamepadConnected = false;
        let lastGamepadJumpPressed = false;

        function checkGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];

            if (gp) {
                if (!gamepadConnected) {
                    gamepadConnected = true;
                    gamepadBadge.style.display = 'block';
                }

                // Button 0 (A / Cross), Button 12 (D-pad Up)
                const isJumpPressed = gp.buttons[0]?.pressed || gp.buttons[12]?.pressed;
                if (isJumpPressed && !lastGamepadJumpPressed) {
                    doJump();
                }
                lastGamepadJumpPressed = isJumpPressed;

                // Button 1 (B / Circle) or Button 13 (D-pad Down)
                const isDuckPressed = gp.buttons[1]?.pressed || gp.buttons[13]?.pressed;
                setDucking(isDuckPressed);
            } else if (gamepadConnected) {
                gamepadConnected = false;
                gamepadBadge.style.display = 'none';
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            screenShake = 10;
            playSound('crash');

            for(let i=0; i<12; i++) {
                particles.push({
                    x: player.x + Math.random() * player.width,
                    y: player.y + Math.random() * player.height,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.8) * 8,
                    size: Math.random() * 4 + 3,
                    alpha: 1.0
                });
            }

            if (currentScore > highScore) {
                highScore = currentScore;
                localStorage.setItem('dino_hi_score', highScore.toString());
                hiVal.innerText = highScore.toString().padStart(5, '0');
            }

            scoreSummary.innerText = `SCORE: ${currentScore.toString().padStart(5, '0')}`;
            gameOverModal.style.display = 'block';
        }

        function resetGame() {
            isGameOver = false;
            gameOverModal.style.display = 'none';
            currentScore = 0;
            speed = BASE_SPEED;
            obstacles.length = 0;
            bonusBits.length = 0;
            particles.length = 0;
            runningDust.length = 0;
            player.y = 0;
            player.vy = 0;
            player.isDucking = false;
            player.canDoubleJump = true;
            spawnTimer = 0;
        }

        // 5. Update Loop
        let spawnTimer = 0;
        let stepDustTimer = 0;

        function update() {
            checkGamepad();

            if (isGameOver) {
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4;
                    p.alpha -= 0.02;
                });
                return;
            }

            const floorY = canvas.height * 0.65;

            // Ducking Dimensions
            if (player.isDucking && player.onGround) {
                player.width = 38;
                player.height = 18;
            } else {
                player.width = player.baseWidth;
                player.height = player.baseHeight;
            }

            // Gravity
            player.vy += GRAVITY;
            player.y += player.vy;

            if (player.y >= floorY - player.height) {
                player.y = floorY - player.height;
                player.vy = 0;
                player.onGround = true;
                player.canDoubleJump = true;
            }

            // Dust Trail
            if (player.onGround) {
                stepDustTimer++;
                if (stepDustTimer % 6 === 0) {
                    runningDust.push({
                        x: player.x,
                        y: floorY - 2,
                        vx: -Math.random() * 2 - 1,
                        vy: -Math.random() * 1.0,
                        size: 2.5, alpha: 0.7
                    });
                }
            }

            // Score & Milestones
            currentScore += 1;
            scoreVal.innerText = currentScore.toString().padStart(5, '0');

            if (currentScore % 100 === 0) {
                playSound('milestone');
            }

            // Balanced Smooth Progressive Speed Curve (gentle slope)
            // Reaches ~7.0 speed at 500 score, ~9.0 speed at 1500 score
            speed = BASE_SPEED + Math.log10(1 + currentScore * 0.003) * 3.2;

            // Spawner
            spawnTimer += 1;
            const spawnInterval = Math.max(50, 110 - (speed * 4.5));
            if (spawnTimer > spawnInterval) {
                if (Math.random() < 0.65) {
                    spawnObstacle();
                    spawnTimer = 0;
                }
            }

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= speed;
                if (obs.type === 'bird') obs.wing += 0.15;

                // Forgiving Collision Margin
                const margin = 5;
                if (player.x + player.width - margin > obs.x && player.x + margin < obs.x + obs.w) {
                    if (player.y + player.height - margin > obs.y && player.y + margin < obs.y + obs.h) {
                        triggerGameOver();
                        break;
                    }
                }

                if (obs.x < -60) obstacles.splice(i, 1);
            }

            // Move Bonus Bits (✦)
            for (let i = bonusBits.length - 1; i >= 0; i--) {
                const bit = bonusBits[i];
                bit.x -= speed;

                if (!bit.collected && Math.hypot(player.x + player.width/2 - bit.x, player.y + player.height/2 - bit.y) < 28) {
                    bit.collected = true;
                    currentScore += 50;
                    playSound('gem');
                    bonusBits.splice(i, 1);
                    continue;
                }

                if (bit.x < -20) bonusBits.splice(i, 1);
            }

            // Move Background
            clouds.forEach(c => {
                c.x -= speed * 0.25;
                if (c.x < -60) c.x = canvas.width + 40;
            });

            groundDots.forEach(g => {
                g.x -= speed;
                if (g.x < -10) g.x = canvas.width + 10;
            });

            // Dust decay
            for (let i = runningDust.length - 1; i >= 0; i--) {
                const d = runningDust[i];
                d.x += d.vx;
                d.y += d.vy;
                d.alpha -= 0.035;
                if (d.alpha <= 0) runningDust.splice(i, 1);
            }

            if (screenShake > 0) screenShake *= 0.85;
            if (screenShake < 0.2) screenShake = 0;
        }

        // 6. Draw Loop
        function draw() {
            ctx.fillStyle = '#202124';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const floorY = canvas.height * 0.65;
            const shakeOffset = (Math.random() - 0.5) * screenShake;
            const activeSkin = SKINS[currentSkinIndex];

            // Draw Clouds
            ctx.fillStyle = '#2d2e31';
            clouds.forEach(c => {
                ctx.fillRect(c.x, c.y, c.w, c.h);
            });

            // Draw Ground Baseline
            ctx.strokeStyle = '#5f6368';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, floorY + shakeOffset);
            ctx.lineTo(canvas.width, floorY + shakeOffset);
            ctx.stroke();

            // Ground Dots
            ctx.fillStyle = '#5f6368';
            groundDots.forEach(g => {
                ctx.fillRect(g.x, g.y + shakeOffset, g.w, 2);
            });

            // Running Dust
            runningDust.forEach(d => {
                ctx.fillStyle = '#5f6368';
                ctx.globalAlpha = d.alpha;
                ctx.fillRect(d.x, d.y + shakeOffset, d.size, d.size);
            });
            ctx.globalAlpha = 1.0;

            // Bonus Bits (✦)
            bonusBits.forEach(b => {
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(b.x - b.size/2, b.y - b.size/2 + shakeOffset, b.size, b.size);
                ctx.fillRect(b.x - 2, b.y - 6 + shakeOffset, 4, 12);
                ctx.fillRect(b.x - 6, b.y - 2 + shakeOffset, 12, 4);
            });

            // Obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = '#e8eaed';
                if (obs.type === 'cactus') {
                    ctx.fillRect(obs.x, obs.y + shakeOffset, obs.w, obs.h);
                    ctx.fillRect(obs.x - 3, obs.y + 6 + shakeOffset, 3, obs.h / 2);
                    ctx.fillRect(obs.x + obs.w, obs.y + 10 + shakeOffset, 3, obs.h / 2);
                } else if (obs.type === 'bird') {
                    ctx.fillRect(obs.x, obs.y + shakeOffset, obs.w, obs.h);
                    const wingOffset = Math.sin(obs.wing) * 6;
                    ctx.fillRect(obs.x + 8, obs.y - wingOffset + shakeOffset, 12, 4);
                }
            });

            // Draw Player with Custom Skins
            if (!isGameOver) {
                ctx.fillStyle = activeSkin.color;
                
                if (activeSkin.shape === 'diamond') {
                    // Diamond Skin
                    ctx.save();
                    ctx.translate(player.x + player.width/2, player.y + player.height/2 + shakeOffset);
                    ctx.rotate(Math.PI / 4);
                    ctx.fillRect(-player.width/2.2, -player.height/2.2, player.width/1.1, player.height/1.1);
                    ctx.restore();
                } else if (activeSkin.shape === 'neon_triangle') {
                    // Triangle Fighter Skin
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.width, player.y + player.height/2 + shakeOffset);
                    ctx.lineTo(player.x, player.y + shakeOffset);
                    ctx.lineTo(player.x, player.y + player.height + shakeOffset);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Classic Square & Bot
                    ctx.fillRect(player.x, player.y + shakeOffset, player.width, player.height);
                }

                // Eye
                ctx.fillStyle = activeSkin.eye;
                if (player.isDucking) {
                    ctx.fillRect(player.x + player.width - 6, player.y + 3 + shakeOffset, 3, 3);
                } else {
                    ctx.fillRect(player.x + player.width - 7, player.y + 4 + shakeOffset, 3, 3);
                }
            } else {
                // Death Shatter Particles
                particles.forEach(p => {
                    ctx.fillStyle = activeSkin.color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillRect(p.x, p.y + shakeOffset, p.size, p.size);
                });
                ctx.globalAlpha = 1.0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
